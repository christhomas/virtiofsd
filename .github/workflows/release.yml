# Release pipeline.
#
# Fires when a `vX.Y.Z` tag is pushed (or via manual dispatch against an
# existing tag). It validates the version, builds the `virtiofsd` binary on
# native runners, and attaches the tarballs to a GitHub Release on THIS repo.
#
# This repo only builds and publishes its OWN releases. It deliberately does
# NOT push to the Homebrew tap or any other repo — no cross-project pipeline
# links that could auto-ship software. The tap pulls these released artifacts
# on its own, human-triggered schedule.
#
# Targets, all built on NATIVE runners (no cross-compilation):
#   * darwin-arm64    (macos-15)        — consumed by Homebrew
#   * darwin-x86_64   (macos-15-intel)  — consumed by Homebrew
#   * linux-x86_64    (ubuntu-latest)   — downloadable artifact only
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v1.14.0'
        required: true

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.95.0"
  CARGO_TERM_COLOR: always

jobs:
  # Gate everything on a well-formed, monotonically-increasing version so
  # Homebrew never receives a malformed or regressive release.
  validate:
    name: Validate version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate tag format, Cargo.toml match, and monotonic version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Validating release tag: ${RAW}"

          # 1) Format: vMAJOR.MINOR.PATCH, with an optional fourth component as a
          #    PACKAGING REVISION (v1.14.0.1), and an optional -prerelease suffix.
          #
          #    The fourth component exists because Cargo.toml belongs upstream. This
          #    fork tracks a GitLab project and sends its source changes there as a
          #    merge request; editing the version in that request would be proposing
          #    a release upstream has not made. But this fork still needs to ship a
          #    macOS fix on top of an upstream version, and a tag can only be used
          #    once.
          #
          #    So the first three components stay exactly upstream's, and the fourth
          #    counts this fork's builds of it — the same meaning Debian gives
          #    1.14.0-1. Nothing upstream sees changes, which is the point: it is the
          #    variant least likely to read as a claim about their release.
          #
          #    Consequence worth knowing: the binary reports CARGO_PKG_VERSION, so
          #    `virtiofsd --version` prints 1.14.0 for a v1.14.0.1 release. That is
          #    accurate — the code IS upstream 1.14.0; only the packaging differs.
          if ! printf '%s' "${RAW}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '${RAW}' must be vMAJOR.MINOR.PATCH, optionally .REVISION, optionally -prerelease"
            exit 1
          fi
          VERSION="${RAW#v}"

          # 2) The upstream part of the tag must match Cargo.toml, so the binary
          #    reports the version its source claims. The packaging revision and any
          #    prerelease suffix are ours and are stripped before comparing.
          UPSTREAM_PART="$(printf '%s' "${VERSION}" | sed -E 's/-.*$//; s/^([0-9]+\.[0-9]+\.[0-9]+)(\.[0-9]+)?$/\1/')"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          if [ "${UPSTREAM_PART}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag '${VERSION}' targets upstream ${UPSTREAM_PART}, but Cargo.toml says ${CARGO_VERSION}." >&2
            echo "::error::Either tag ${CARGO_VERSION} (optionally .REVISION), or rebase onto the upstream version you meant." >&2
            exit 1
          fi
          echo "OK: tag targets upstream ${UPSTREAM_PART}, matching Cargo.toml"

          # 3) Must be strictly newer than the latest published release. Map '-'
          #    to '~' so `sort -V` orders pre-releases before their release
          #    (1.13.8-rc1 < 1.13.8), matching SemVer.
          LATEST="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 \
                      --json tagName,isDraft --jq '.[] | select(.isDraft|not) | .tagName' 2>/dev/null \
                    | sed 's/^v//' | sort -V | tail -1 || true)"
          if [ -n "${LATEST}" ]; then
            # Map '-' to '~' so `sort -V` orders pre-releases before the release
            # they precede (1.13.8-rc1 < 1.13.8), matching SemVer.
            new_cmp="$(printf '%s' "${VERSION}" | tr '-' '~')"
            prev_cmp="$(printf '%s' "${LATEST}" | tr '-' '~')"
            highest="$(printf '%s\n%s\n' "${new_cmp}" "${prev_cmp}" | sort -V | tail -1)"
            if [ "${new_cmp}" = "${prev_cmp}" ] || [ "${highest}" != "${new_cmp}" ]; then
              echo "::error::Version '${VERSION}' is not greater than the latest release '${LATEST}'. Homebrew requires increasing versions."
              exit 1
            fi
            echo "OK: ${VERSION} > ${LATEST}"
          else
            echo "OK: first release (${VERSION}); no prior release to compare against."
          fi

  # A tag pushed past a broken commit must never ship: re-run the test suite.
  test:
    name: Test before release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libseccomp-dev libcap-ng-dev
      - run: cargo test

  build:
    name: build (${{ matrix.artifact }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: darwin-arm64
          - runner: macos-15-intel
            artifact: darwin-x86_64
          - runner: ubuntu-latest
            artifact: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libseccomp-dev libcap-ng-dev

      - name: Determine version
        id: ver
        shell: bash
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      # --locked so the build uses Cargo.lock exactly as committed and fails rather
      # than silently resolving a newer dependency. A release that quietly picked
      # up different crate versions than the tree describes is not reproducible by
      # anyone, including us.
      - name: Build release binary
        run: cargo build --release --locked --bin virtiofsd

      - name: Package
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          cp target/release/virtiofsd dist/
          cd dist
          tar czf "virtiofsd-${{ steps.ver.outputs.version }}-${{ matrix.artifact }}.tar.gz" virtiofsd

      # Checksum the BINARY, not the archive. Two runs produce identical binaries;
      # the archives can differ in metadata (mtimes, ordering) without the binary
      # differing at all, so the binary hash is the only part that is independent
      # of how it was packaged — and it is what the reproduce step can compare.
      - name: Record the binary checksum and toolchain
        id: sum
        shell: bash
        run: |
          set -euo pipefail
          sum=$(shasum -a 256 target/release/virtiofsd | cut -d' ' -f1)
          echo "sha256=${sum}" >> "$GITHUB_OUTPUT"
          # Single space between hash and name, so the file is easy to read and to
          # parse. The name matches the published archive minus its extension.
          echo "${sum} virtiofsd-${{ steps.ver.outputs.version }}-${{ matrix.artifact }}" \
            > "checksum-${{ matrix.artifact }}.txt"
          # Record the exact compiler, because "same source" only implies "same
          # bytes" for a given toolchain. Without this a verifier cannot know which
          # rustc to use, which makes the checksum unfalsifiable rather than proven.
          rustc --version > "toolchain-${{ matrix.artifact }}.txt"
          cat "checksum-${{ matrix.artifact }}.txt" "toolchain-${{ matrix.artifact }}.txt"

      # Prove the claim rather than asserting it: wipe the build directory, rebuild
      # from this same commit on this same runner, and require the binary to be
      # byte-identical to the one just packaged.
      #
      # If a future change makes the build non-reproducible — an embedded timestamp,
      # an absolute path, a floating dependency — this fails here, rather than a
      # user discovering it when they try to verify a release.
      #
      # Scope worth being honest about: this proves determinism for a given
      # toolchain, on a given runner image, from a given Cargo.lock. It does not
      # prove the build is independent of the build path or of the machine. That is
      # a stronger property, and it is not what is claimed.
      - name: Reproduce the binary independently
        shell: bash
        run: |
          set -euo pipefail
          want='${{ steps.sum.outputs.sha256 }}'
          cargo clean
          cargo build --release --locked --bin virtiofsd
          got=$(shasum -a 256 target/release/virtiofsd | cut -d' ' -f1)
          if [ "$got" = "$want" ]; then
            echo "${{ matrix.artifact }}: reproduced — ${got}"
          else
            echo "::error::${{ matrix.artifact }} did not reproduce. packaged=${want} rebuilt=${got}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: virtiofsd-${{ matrix.artifact }}
          # The checksum and toolchain files travel with the archive so the release
          # job can assemble them into one provenance file. Each build runs on a
          # different runner, so this is the only way they meet.
          path: |
            dist/*.tar.gz
            checksum-${{ matrix.artifact }}.txt
            toolchain-${{ matrix.artifact }}.txt
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build SHA256SUMS
        shell: bash
        run: |
          set -eux
          cd dist
          shasum -a 256 virtiofsd-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # SHA256SUMS covers the archives, which is what a downloader verifies.
      # binaries.txt covers the binaries INSIDE them, which is what someone
      # rebuilding from source can compare against — an archive hash cannot be
      # reproduced without reproducing the archiving too.
      #
      # Each build job already rebuilt its own binary and required a byte-identical
      # result, so every line here has been checked on the runner that produced it.
      # This file records the outcome and the compiler it holds for.
      - name: Determine tag and version
        id: ver
        shell: bash
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${RAW}" >> "$GITHUB_OUTPUT"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries.txt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# virtiofsd ${{ steps.ver.outputs.tag }} — sha256 of the binary inside each archive."
            echo "#"
            echo "# Each was verified on its build runner by wiping the target directory,"
            echo "# rebuilding from this commit, and requiring identical bytes. To check one"
            echo "# yourself, build with the matching toolchain below and compare:"
            echo "#"
            echo "#   cargo build --release --locked --bin virtiofsd"
            echo "#   shasum -a 256 target/release/virtiofsd"
            echo "#"
            for t in dist/toolchain-*.txt; do
              [ -e "$t" ] || continue
              a=$(basename "$t" .txt); a=${a#toolchain-}
              echo "# ${a}: $(cat "$t")"
            done
            echo "#"
            cat dist/checksum-*.txt
          } > dist/binaries.txt
          cat dist/binaries.txt
          # The provenance files have served their purpose; keep them out of the
          # release so the asset list stays the archives plus two sums files.
          rm -f dist/checksum-*.txt dist/toolchain-*.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: virtiofsd ${{ steps.ver.outputs.tag }}
          # generate_release_notes was true, and produced wrong notes.
          #
          # GitHub builds those notes from commit ancestry between this tag and the
          # previous one. This branch is rebased onto upstream rather than merged,
          # so each release tag is left on an abandoned lineage: v1.13.8 is not an
          # ancestor of this branch, and `git describe` finds no tag from its tip at
          # all. Asking for a diff between two tags that share no recent history
          # yields either noise or nothing.
          #
          # The body below is written by hand instead, which is honest about what a
          # fork release is: upstream's code at a stated version, plus this fork's
          # port, built for these platforms.
          fail_on_unmatched_files: true
          files: |
            dist/virtiofsd-*.tar.gz
            dist/SHA256SUMS
            dist/binaries.txt
          body: |
            virtiofsd ${{ steps.ver.outputs.tag }} — macOS port (Apple Silicon + Intel) and Linux x86_64.

            ## Install via Homebrew (macOS)
            ```
            brew install antimatter-studios/tap/virtiofsd
            ```

            The Linux binary is dynamically linked; it needs `libseccomp` and
            `libcap-ng` available at runtime.

            ## Verifying these binaries

            `SHA256SUMS` covers the archives — check a download with
            `shasum -a 256 -c SHA256SUMS`.

            `binaries.txt` covers the binary *inside* each archive, and records the
            exact compiler each was built with. Every line was verified on the runner
            that produced it: the build directory was wiped, the binary rebuilt from
            this commit, and the result required to be byte-identical. To repeat that
            yourself, build with the toolchain named in the file and compare:

            ```
            cargo build --release --locked --bin virtiofsd
            shasum -a 256 target/release/virtiofsd
            ```

            An archive hash cannot be reproduced without reproducing the archiving
            too, which is why the binary hash is published separately.
